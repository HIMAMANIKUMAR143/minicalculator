<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>calculator</title>

    <style>
      .calci {
        height: 750px;
        width: 480px;
        border: 10px;
        border-radius: 20px;

        background-color: black;
      }
      .number {
        height: 20%;
        width: 470px;
        border-radius: 60px;
        font-size: 50px;
        background-color: whitesmoke;
      }
      button {
        font-size: 60px;

        padding: 15px;
        cursor: pointer;
        border-radius: 50px;
        background-color: orange;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: skyblue;
      }
      .naveen {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 5px;
        cursor: none;
      }
      button:hover {
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="calci">
      <br />

      <input
        type="text"
        class="number"
        for="naveen"
        placeholder="enter a value"
      />
      <br />
      <br />
      <div class="naveen">
        <button>c</button>
        <button>(</button>
        <button>)</button>
        <button>-</button>
        <button>9</button>
        <button>8</button>
        <button>7</button>
        <button>*</button>
        <button>6</button>
        <button>5</button>
        <button>4</button>
        <button>+</button>
        <button>3</button>
        <button>2</button>
        <button>1</button>
        <button>/</button>

        <button>0</button>
        <button>.</button>
        <button>%</button>
        <button>=</button>
      </div>
      <br />
    </div>
    <script src="/project1/calculator.js"></script>
  </body>
</html>
